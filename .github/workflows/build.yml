
name: Build Realistic Water

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile mod
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Save compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: Realistic-Water-build
          path: build/libs/*.jar
          if-no-files-found: error
